[project]
name = "mcpd"
version = "0.1.0"
description = "One local login and refresh owner for remote MCP servers, shared by every agent session"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4"]

[project.scripts]
mcpd = "mcpd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpd"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
